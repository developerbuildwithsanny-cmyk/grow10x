<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pink network/branching icon (Make.com) matching attached image -->
  <!-- Circle 1 (leftmost) -->
  <circle cx="14" cy="50" r="8.5" fill="none" stroke="#E84473" stroke-width="5"/>
  <!-- Circle 2 (center-left) -->
  <circle cx="40" cy="50" r="8.5" fill="none" stroke="#E84473" stroke-width="5"/>
  <!-- Connector: circle 1 to circle 2 -->
  <line x1="22.5" y1="50" x2="31.5" y2="50" stroke="#E84473" stroke-width="5" stroke-linecap="round"/>
  <!-- Circle 3 (junction) -->
  <circle cx="59" cy="50" r="8.5" fill="none" stroke="#E84473" stroke-width="5"/>
  <!-- Connector: circle 2 to circle 3 -->
  <line x1="48.5" y1="50" x2="50.5" y2="50" stroke="#E84473" stroke-width="5" stroke-linecap="round"/>
  <!-- Upper branch curve -->
  <path d="M67 44 C74 34 76 26 78 20" stroke="#E84473" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Upper branch circle -->
  <circle cx="84" cy="16" r="8.5" fill="none" stroke="#E84473" stroke-width="5"/>
  <!-- Lower branch curve -->
  <path d="M67 56 C74 66 76 74 78 80" stroke="#E84473" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Lower branch circle -->
  <circle cx="84" cy="84" r="8.5" fill="none" stroke="#E84473" stroke-width="5"/>
</svg>
